# Release build for the Miyoo Mini Plus: the core (PGO profile from miyoo/pgo/, collected on the
# device by miyoo/tools/pgo.sh) and tqrun, packed by miyoo/build/build_release.sh.
# By hand (Actions → Run workflow): the zips as an artifact. A pushed tag v*: also a draft
# pre-release with both zips, to be checked on the device (shots, bench) before publishing.
name: Miyoo release build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain cache
        id: tc
        uses: actions/cache@v4
        with:
          path: ~/arm-gnu-toolchain
          key: arm-gnu-toolchain-13.3.rel1-x86_64-arm-none-linux-gnueabihf

      # the same GCC as the local builds (Arm GNU Toolchain 13.3.Rel1), Linux-hosted
      - name: Toolchain download
        if: steps.tc.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/arm-gnu-toolchain
          curl -fsSL https://developer.arm.com/-/media/Files/downloads/gnu/13.3.rel1/binrel/arm-gnu-toolchain-13.3.rel1-x86_64-arm-none-linux-gnueabihf.tar.xz |
            tar xJ -C ~/arm-gnu-toolchain --strip-components=1

      - name: Build
        run: |
          case "$GITHUB_REF" in
          refs/tags/*) TAG=$GITHUB_REF_NAME ;;
          *) TAG=$(git rev-parse --short HEAD) ;;
          esac
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          TC=$HOME/arm-gnu-toolchain/bin sh miyoo/build/build_release.sh "$TAG"
          # build_release.sh writes to <workspace>/build, two levels above the checkout
          B=$(cd ../.. && pwd)/build
          mkdir -p out
          cp "$B"/release/*.zip "$B/core_release/tyrquake_libretro.so" "$B/standalone/tqrun" out/
          (cd out && md5sum tyrquake_libretro.so tqrun *.zip) | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: TyrQuake-Miyoo-${{ env.TAG }}
          path: out/

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --draft --prerelease --verify-tag --title "TyrQuake-Miyoo $TAG" \
            --notes "Built by GitHub Actions. Check on the device (shots, bench) before publishing." out/*.zip
